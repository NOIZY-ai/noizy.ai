name = "gabriel-hp-omen"
main = "src/index.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

# Workers AI Binding
[ai]
binding = "GABRIEL"

# Environment Variables
[vars]
ENVIRONMENT = "production"
GABRIEL_VERSION = "INFINITY_X1000"
HP_OMEN_IP = "10.0.0.160"
HP_OMEN_VPN_IP = "10.100.0.2"

# D1 Database for MemCell
[[d1_databases]]
binding = "MEMCELL"
database_name = "gabriel-memcell"
database_id = "your-database-id-here"

# KV for cache
[[kv_namespaces]]
binding = "GABRIEL_CACHE"
id = "your-kv-id-here"

# Queue for async batch processing
[[queues.producers]]
queue = "gabriel-tasks"
binding = "TASK_QUEUE"

# Queue consumer for batch processing
[[queues.consumers]]
queue = "gabriel-tasks"
max_batch_size = 10
max_batch_timeout = 30
max_retries = 3

# R2 for storage
[[r2_buckets]]
binding = "GABRIEL_STORAGE"
bucket_name = "gabriel-files"

# AI Gateway for observability and caching
# Uncomment after creating gateway in dashboard
# [ai.gateway]
# id = "gabriel-gateway"
# skip_logging = false
# cache_ttl = 3600

# Production environment
[env.production]
name = "gabriel-hp-omen-prod"
route = { pattern = "gabriel.noizylab.com/*", zone_name = "noizylab.com" }

[env.production.vars]
ENVIRONMENT = "production"

# Staging environment
[env.staging]
name = "gabriel-hp-omen-staging"

[env.staging.vars]
ENVIRONMENT = "staging"
