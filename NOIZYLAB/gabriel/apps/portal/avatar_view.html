<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>GABRIEL | 3D LIVE CORE</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
            color: #0ff;
            font-family: monospace;
        }

        #info {
            position: absolute;
            top: 10px;
            width: 100%;
            text-align: center;
        }

        #canvas-container {
            width: 100vw;
            height: 100vh;
        }
    </style>
    <!-- Load Three.js from CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>

<body>
    <div id="info">GABRIEL LIVING AVATAR | SYSTEM: ONLINE | M2 ULTRA</div>
    <div id="canvas-container"></div>

    <script>
        // INIT SCENE
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x000000, 0.02);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 5;

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        // CREATE AVATAR (THE CORE)
        // A complex Icosahedron with wireframe acting as the "Brain"
        const geometry = new THREE.IcosahedronGeometry(2, 2);
        const material = new THREE.MeshBasicMaterial({
            color: 0x00ffff,
            wireframe: true,
            transparent: true,
            opacity: 0.8
        });
        const core = new THREE.Mesh(geometry, material);
        scene.add(core);

        // INNER GLOW
        const innerGeo = new THREE.IcosahedronGeometry(1.5, 1);
        const innerMat = new THREE.MeshBasicMaterial({
            color: 0x0044ff,
            wireframe: false,
            transparent: true,
            opacity: 0.3
        });
        const innerCore = new THREE.Mesh(innerGeo, innerMat);
        scene.add(innerCore);

        // PARTICLES (DATA STREAM)
        const particlesGeo = new THREE.BufferGeometry();
        const particlesCount = 2000;
        const posArray = new Float32Array(particlesCount * 3);
        for (let i = 0; i < particlesCount * 3; i++) {
            posArray[i] = (Math.random() - 0.5) * 20;
        }
        particlesGeo.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
        const particlesMat = new THREE.PointsMaterial({
            size: 0.02,
            color: 0xffffff
        });
        const particles = new THREE.Points(particlesGeo, particlesMat);
        scene.add(particles);

        // NEURAL LINK (WEBSOCKET CLIENT)
        const ws = new WebSocket('ws://localhost:8765');
        let voiceActive = false;
        let lastVoiceTime = 0;

        ws.onopen = () => {
            console.log('🧠 NEURAL LINK: CONNECTED');
            document.getElementById('info').innerHTML += " | LINK: <span style='color:#0f0'>ACTIVE</span>";
        };

        ws.onmessage = (event) => {
            const msg = JSON.parse(event.data);

            if (msg.type === 'voice_active') {

                // ANIMATION LOOP
                const clock = new THREE.Clock();

                function animate() {
                    requestAnimationFrame(animate);

                    const time = clock.getElapsedTime();

                    // Decay voice activity
                    if (voiceActive && (Date.now() - lastVoiceTime > 500)) {
                        voiceActive = false;
                        core.material.color.setHex(0x00ffff); // Reset color
                    }

                    // Core Pulse (Amp up if voice active)
                    const pulseSpeed = voiceActive ? 10 : 2;
                    const pulseAmp = voiceActive ? 0.2 : 0.05;

                    const scale = 1 + Math.sin(time * pulseSpeed) * pulseAmp;
                    core.scale.set(scale, scale, scale);

                    // Rotation strategy
                    const rotSpeed = voiceActive ? 0.02 : 0.002;
                    core.rotation.x += rotSpeed;
                    core.rotation.y += 0.005;
                    innerCore.rotation.y -= 0.01;

                    // Particles Drift
                    particles.rotation.y = time * 0.05;

                    // Color Shift (Subtle idle, or locked if voice)
                    if (!voiceActive) {
                        const hue = (time * 0.05) % 1;
                        core.material.color.setHSL(hue, 1, 0.5);
                    }

                    renderer.render(scene, camera);
                }

                // RESIZE HANDLER
                window.addEventListener('resize', () => {
                    camera.aspect = window.innerWidth / window.innerHeight;
                    camera.updateProjectionMatrix();
                    renderer.setSize(window.innerWidth, window.innerHeight);
                });

                animate();
    </script>
</body>

</html>
