[project]
name = "titanhive"
version = "1.0.0"
description = "GABRIEL Command Center - TitanHive TUI"
requires-python = ">=3.10"
dependencies = [
    "textual>=0.85.0",
    "rich>=13.0.0",
    "httpx>=0.27.0",
    "psutil>=5.9.0",
    "python-dotenv>=1.0.0",
    "typer>=0.9.0",
    "mcp>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]
fastmcp = [
    "fastmcp>=0.5.0",
]

[project.scripts]
titanhive = "main:GabrielHive.run"
titan = "main:GabrielHive.run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
