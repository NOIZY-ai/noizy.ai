# ☸️ CELERY WORKER DEPLOYMENT - 100% PERFECT
# GORUNFREE Protocol

apiVersion: apps/v1
kind: Deployment
metadata:
  name: gabriel-worker
  namespace: gabriel
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gabriel-worker
  template:
    metadata:
      labels:
        app: gabriel-worker
    spec:
      containers:
      - name: worker
        image: gabriel:latest
        command: ["celery", "-A", "infrastructure.queue.celery_tasks", "worker", "--loglevel=info"]
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: gabriel-secrets
              key: database-url
        - name: REDIS_URL
          valueFrom:
            secretKeyRef:
              name: gabriel-secrets
              key: redis-url
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "1Gi"
            cpu: "1000m"

